<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景円 -->
  <circle cx="256" cy="256" r="240" fill="#2563eb" stroke="#1e40af" stroke-width="8"/>
  
  <!-- 馬のシルエット -->
  <g transform="translate(256, 256)">
    <!-- 馬の頭部 -->
    <path d="M-60 -80 Q-40 -100 -20 -90 Q0 -85 10 -70 Q15 -50 10 -30 Q5 -20 -10 -25 Q-30 -30 -45 -40 Q-55 -60 -60 -80 Z" fill="white"/>
    
    <!-- 馬の首 -->
    <path d="M-45 -40 Q-30 -20 -20 0 Q-15 20 -10 40 Q-5 50 5 45 Q15 40 20 30 Q25 10 20 -10 Q10 -30 -10 -25 Q-30 -30 -45 -40 Z" fill="white"/>
    
    <!-- 馬の胴体 -->
    <ellipse cx="0" cy="20" rx="80" ry="40" fill="white"/>
    
    <!-- 馬の脚 -->
    <rect x="-50" y="50" width="8" height="60" fill="white"/>
    <rect x="-30" y="50" width="8" height="65" fill="white"/>
    <rect x="20" y="50" width="8" height="60" fill="white"/>
    <rect x="40" y="50" width="8" height="65" fill="white"/>
    
    <!-- 馬の尻尾 -->
    <path d="M70 10 Q90 20 95 40 Q90 60 80 50 Q75 35 70 20 Z" fill="white"/>
    
    <!-- たてがみ -->
    <path d="M-20 -70 Q-10 -85 0 -80 Q-5 -75 -10 -65 Q-15 -70 -20 -70 Z" fill="white"/>
  </g>
  
  <!-- 競馬場のトラック -->
  <g transform="translate(256, 400)">
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="none" stroke="white" stroke-width="4" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="160" ry="25" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- 数字（予想を表現） -->
  <g transform="translate(380, 150)">
    <circle cx="0" cy="0" r="25" fill="white"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2563eb">1</text>
  </g>
  
  <!-- グラフアイコン（統計を表現） -->
  <g transform="translate(150, 380)">
    <rect x="-15" y="-10" width="6" height="20" fill="white"/>
    <rect x="-5" y="-20" width="6" height="30" fill="white"/>
    <rect x="5" y="-15" width="6" height="25" fill="white"/>
    <rect x="15" y="-25" width="6" height="35" fill="white"/>
  </g>
</svg>