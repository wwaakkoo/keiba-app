<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        .icon-preview { display: inline-block; margin: 10px; text-align: center; }
    </style>
</head>
<body>
    <h1>競馬アプリ アイコン生成</h1>
    <div id="icons"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const iconsContainer = document.getElementById('icons');
        
        // SVGを読み込んでPNGに変換
        async function generateIcons() {
            const svgResponse = await fetch('../public/icons/icon-base.svg');
            const svgText = await svgResponse.text();
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = size;
                canvas.height = size;
                
                const img = new Image();
                const svgBlob = new Blob([svgText], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    // PNGとしてダウンロードリンクを作成
                    canvas.toBlob(function(blob) {
                        const link = document.createElement('a');
                        link.download = `icon-${size}.png`;
                        link.href = URL.createObjectURL(blob);
                        
                        const preview = document.createElement('div');
                        preview.className = 'icon-preview';
                        preview.innerHTML = `
                            <div>${size}x${size}</div>
                            <canvas width="${Math.min(size, 64)}" height="${Math.min(size, 64)}"></canvas>
                            <br>
                            <a href="${link.href}" download="${link.download}">ダウンロード</a>
                        `;
                        
                        // プレビュー用の小さなキャンバス
                        const previewCanvas = preview.querySelector('canvas');
                        const previewCtx = previewCanvas.getContext('2d');
                        const previewSize = Math.min(size, 64);
                        previewCtx.drawImage(canvas, 0, 0, previewSize, previewSize);
                        
                        iconsContainer.appendChild(preview);
                    });
                    
                    URL.revokeObjectURL(url);
                };
                
                img.src = url;
            });
        }
        
        generateIcons();
    </script>
</body>
</html>
