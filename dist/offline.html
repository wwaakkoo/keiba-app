<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オフライン - 競馬予想アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 400px;
            width: 100%;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .offline-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .offline-message {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .offline-features {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }
        
        .offline-features h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .offline-features ul {
            list-style: none;
            text-align: left;
        }
        
        .offline-features li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .offline-features li:last-child {
            border-bottom: none;
        }
        
        .offline-features li::before {
            content: "✓";
            color: #4ade80;
            font-weight: bold;
            margin-right: 0.5rem;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .connection-status {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .connection-status.online {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        
        .connection-status.offline {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        
        @media (max-width: 480px) {
            .offline-icon {
                font-size: 3rem;
            }
            
            .offline-title {
                font-size: 1.3rem;
            }
            
            .offline-message {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📱</div>
        <h1 class="offline-title">オフラインモード</h1>
        <p class="offline-message">
            インターネット接続が利用できません。<br>
            オフラインでも以下の機能をご利用いただけます。
        </p>
        
        <div class="offline-features">
            <h3>利用可能な機能</h3>
            <ul>
                <li>保存済みの予想データの閲覧</li>
                <li>過去の投資記録の確認</li>
                <li>統計データの表示</li>
                <li>新しい予想の作成（後で同期）</li>
                <li>設定の変更</li>
            </ul>
        </div>
        
        <button class="retry-button" onclick="checkConnection()">
            接続を再試行
        </button>
        
        <div id="connectionStatus" class="connection-status offline">
            オフライン
        </div>
    </div>

    <script>
        // 接続状態の監視
        function updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');
            if (navigator.onLine) {
                statusElement.textContent = 'オンライン - 再読み込み中...';
                statusElement.className = 'connection-status online';
                // オンラインになったらメインアプリに戻る
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                statusElement.textContent = 'オフライン';
                statusElement.className = 'connection-status offline';
            }
        }

        // 接続チェック
        function checkConnection() {
            updateConnectionStatus();
            if (navigator.onLine) {
                // 実際にネットワークリクエストを送信して確認
                fetch('/', { method: 'HEAD', cache: 'no-cache' })
                    .then(() => {
                        window.location.href = '/';
                    })
                    .catch(() => {
                        alert('接続を確認できませんでした。しばらく待ってから再試行してください。');
                    });
            } else {
                alert('インターネット接続を確認してください。');
            }
        }

        // イベントリスナーの設定
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // 初期状態の設定
        updateConnectionStatus();

        // 定期的な接続チェック
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>
</html>
